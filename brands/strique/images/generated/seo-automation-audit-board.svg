<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">SEO audit issue board</title>
  <desc id="desc">Audit board showing SEO issues for H1s, alt text, canonicals, sitemaps, and analytics evidence.</desc>
  <rect width="1400" height="760" fill="#f7f7f4"/>
  <rect x="80" y="70" width="1240" height="620" rx="28" fill="#ffffff" stroke="#e2e2dc"/>
  <text x="130" y="142" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">What the audit loop catches</text>
  <text x="130" y="188" fill="#606060" font-family="Inter, Arial, sans-serif" font-size="22">The repeat work is boring. That is why it should be automated.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="130" y="255" width="220" height="190" rx="18" fill="#f3f0ff" stroke="#6f4dff"/>
    <text x="158" y="310" fill="#111111" font-size="42" font-weight="750">47</text>
    <text x="158" y="354" fill="#111111" font-size="23" font-weight="700">H1 issues</text>
    <text x="158" y="390" fill="#5c5c5c" font-size="17">Pages failed the</text>
    <text x="158" y="416" fill="#5c5c5c" font-size="17">single-H1 check</text>
    <rect x="382" y="255" width="220" height="190" rx="18" fill="#eef8f5" stroke="#20a67a"/>
    <text x="410" y="310" fill="#111111" font-size="42" font-weight="750">63</text>
    <text x="410" y="354" fill="#111111" font-size="23" font-weight="700">Alt text gaps</text>
    <text x="410" y="390" fill="#5c5c5c" font-size="17">Images need useful</text>
    <text x="410" y="416" fill="#5c5c5c" font-size="17">descriptions</text>
    <rect x="634" y="255" width="220" height="190" rx="18" fill="#fff7e6" stroke="#d99000"/>
    <text x="662" y="310" fill="#111111" font-size="42" font-weight="750">12</text>
    <text x="662" y="354" fill="#111111" font-size="23" font-weight="700">Sitemap gaps</text>
    <text x="662" y="390" fill="#5c5c5c" font-size="17">Canonical URLs need</text>
    <text x="662" y="416" fill="#5c5c5c" font-size="17">sitemap coverage</text>
    <rect x="886" y="255" width="220" height="190" rx="18" fill="#eef2ff" stroke="#4b6fff"/>
    <text x="914" y="310" fill="#111111" font-size="42" font-weight="750">13</text>
    <text x="914" y="354" fill="#111111" font-size="23" font-weight="700">Duplicate signals</text>
    <text x="914" y="390" fill="#5c5c5c" font-size="17">Contact variants share</text>
    <text x="914" y="416" fill="#5c5c5c" font-size="17">canonicals and metas</text>
    <rect x="1138" y="255" width="132" height="190" rx="18" fill="#f5f5f5" stroke="#111111"/>
    <text x="1166" y="310" fill="#111111" font-size="42" font-weight="750">1</text>
    <text x="1166" y="354" fill="#111111" font-size="23" font-weight="700">Data gap</text>
    <text x="1166" y="390" fill="#5c5c5c" font-size="17">PostHog</text>
    <text x="1166" y="416" fill="#5c5c5c" font-size="17">blocked</text>
  </g>
  <rect x="130" y="520" width="1140" height="74" rx="22" fill="#111111"/>
  <text x="170" y="566" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650">A good agent turns each issue into an owner, a fix, and a verification check.</text>
</svg>
