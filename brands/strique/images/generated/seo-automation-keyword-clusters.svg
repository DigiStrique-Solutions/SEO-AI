<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">SEO automation keyword clusters</title>
  <desc id="desc">Keyword cluster map showing SEO automation, AI content creation, AI ad generation, and AI marketing agent demand.</desc>
  <rect width="1400" height="760" fill="#f7f7f4"/>
  <rect x="80" y="70" width="1240" height="620" rx="28" fill="#ffffff" stroke="#e2e2dc"/>
  <text x="130" y="142" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="700">Keyword demand points to the loop</text>
  <text x="130" y="188" fill="#606060" font-family="Inter, Arial, sans-serif" font-size="22">Directional Keyword Planner volume from the Strique keyword universe.</text>
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="408" cy="380" r="160" fill="#f3f0ff" stroke="#6f4dff" stroke-width="3"/>
    <text x="408" y="350" text-anchor="middle" fill="#111111" font-size="28" font-weight="750">AI content</text>
    <text x="408" y="386" text-anchor="middle" fill="#111111" font-size="28" font-weight="750">creation</text>
    <text x="408" y="430" text-anchor="middle" fill="#5c5c5c" font-size="25">73,490</text>
    <circle cx="720" cy="380" r="118" fill="#fff7e6" stroke="#d99000" stroke-width="3"/>
    <text x="720" y="365" text-anchor="middle" fill="#111111" font-size="26" font-weight="750">SEO</text>
    <text x="720" y="399" text-anchor="middle" fill="#111111" font-size="26" font-weight="750">automation</text>
    <text x="720" y="438" text-anchor="middle" fill="#5c5c5c" font-size="23">13,320</text>
    <circle cx="960" cy="375" r="110" fill="#eef8f5" stroke="#20a67a" stroke-width="3"/>
    <text x="960" y="363" text-anchor="middle" fill="#111111" font-size="25" font-weight="750">AI ad</text>
    <text x="960" y="396" text-anchor="middle" fill="#111111" font-size="25" font-weight="750">generation</text>
    <text x="960" y="433" text-anchor="middle" fill="#5c5c5c" font-size="22">11,460</text>
    <circle cx="1115" cy="500" r="72" fill="#eef2ff" stroke="#4b6fff" stroke-width="3"/>
    <text x="1115" y="490" text-anchor="middle" fill="#111111" font-size="19" font-weight="750">AI marketing</text>
    <text x="1115" y="516" text-anchor="middle" fill="#111111" font-size="19" font-weight="750">agent</text>
    <text x="1115" y="548" text-anchor="middle" fill="#5c5c5c" font-size="18">1,670</text>
  </g>
  <path d="M720 505c0 70 -70 110 -160 110" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
  <path d="M560 615l24 -8"/>
  <path d="M560 615l16 20"/>
  <text x="130" y="620" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="650">The article targets SEO automation, then connects content and ads back to execution.</text>
</svg>
